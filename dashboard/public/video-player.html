<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AundeKiosk Video</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
    video { width: 100%; height: 100%; object-fit: contain; display: block; }
  </style>
</head>
<body>
  <video id="v" autoplay playsinline></video>
  <script>
    const params = new URLSearchParams(location.search);
    const filename = params.get('f') || '';
    const mode = params.get('mode') || 'auto'; // 'auto' = play once; 'manual' = loop
    const v = document.getElementById('v');

    if (mode === 'manual') v.loop = true;

    if (filename) {
      v.src = '/video/' + encodeURIComponent(filename);
      v.load();
      v.play().catch(() => {});
    }

    function sendDone() {
      fetch('/video-done', { method: 'POST' }).catch(() => {});
    }

    // Auto mode: signal completion when the video ends naturally.
    if (mode === 'auto') {
      v.addEventListener('ended', sendDone);
    }

    // ESC key exits both modes early.
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') sendDone();
    });
  </script>
</body>
</html>
